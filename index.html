<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Odin Sign Up Form</title>
</head>

<body>

    <main class="page">
        <aside class="hero">
            <div class="logo-strip">
                <img src="img/odin-lined.png" alt="Odin logo">
                <span>ODIN</span>
            </div>

            <p class="photo-credit">
                Photo by <a href="#">Halie West</a> on <a href="#">Unsplash</a>
            </p>
        </aside>

        <section class="signup">
            <header class="intro">
                <p>This is not a real online service! You know you need something like this in your life to help you
                    realize
                    your deepest dreams. Sign up now to get started.</p>
                <p>You <em>know</em> you want to.</p>
            </header>

            <form action="#" method="post">
                <section class="form-card">
                    <h1>Let's do this!</h1>

                    <div class="form-fields">

                        <div class="form-group">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="first-name" required />
                        </div>

                        <div class="form-group">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" name="last-name" required />
                        </div>

                        <div class="form-group">
                            <label for="mail">Email</label>
                            <input type="email" id="mail" name="email" required />
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone number</label>
                            <input type="tel" id="phone" name="phone" required />
                        </div>

                        <div class="form-group">
                            <label for="pwd">Password</label>
                            <input type="password" id="pwd" name="password" minlength="8" required />
                        </div>

                        <div class="form-group">
                            <label for="confirm-pwd">Confirm password</label>
                            <input type="password" id="confirm-pwd" name="confirm-pwd" minlength="8" required />
                        </div>

                    </div>

                </section>

                <button type="submit">Create Account</button>

                <p class="login-text">
                    Already have an account? <a href="#"> Log in</a>
                </p>

            </form>
        </section>
    </main>







</body>

</html>
